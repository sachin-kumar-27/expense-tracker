<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMap - Expense Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="bg"></div>
<div class="container">
  <div class="top">
    <h1>💸 MoneyMap</h1>
    <p id="date"></p>
  </div>

  <div class="balance-card">
    <div>
      <small>Your Balance</small>
      <h1 id="balance">₹0</h1>
      <div class="stats">
        <span class="in"><i class="fa-solid fa-arrow-trend-up"></i> <b id="income">₹0</b></span>
        <span class="out"><i class="fa-solid fa-arrow-trend-down"></i> <b id="expense">₹0</b></span>
      </div>
    </div>
    <canvas id="chart" width="80" height="80"></canvas>
  </div>

  <div class="input-card">
    <div class="tabs">
      <button class="tab active" data-type="expense">Expense</button>
      <button class="tab" data-type="income">Income</button>
    </div>
    <input id="title" placeholder="What is this for?">
    <div class="row">
      <input id="amount" type="number" placeholder="₹ Amount">
      <select id="category">
        <option>🍔 Food</option><option>🛍️ Shopping</option><option>🚕 Travel</option><option>🏠 Bills</option><option>💼 Salary</option><option>🎮 Fun</option>
      </select>
    </div>
    <button id="addBtn">Add Now</button>
  </div>

  <div class="history">
    <div class="h-head"><h3>Recent</h3><button id="clear">Clear</button></div>
    <div id="list"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
